services:
  send-redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - send-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - net-send

  send-web:
    build:
      context: .
      # `runtime` is the FROM scratch image, `slim` the node slim one
      target: runtime
    image: send:latest
    restart: always
    ports:
      - '80:1443'
    depends_on:
      send-redis:
        condition: service_healthy
    networks:
      - net-send
    # the image only writes to /app/uploads and /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - send-uploads:/app/uploads
    environment:
      - BASE_URL=http://localhost
      - REDIS_HOST=send-redis
      - REDIS_PORT=6379

volumes:
  send-redis:
  send-uploads:

networks:
  net-send:
    driver: bridge
